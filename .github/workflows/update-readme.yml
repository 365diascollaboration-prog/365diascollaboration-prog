name: Auto-Update README

on:
  schedule:
    - cron: '0 6 * * 1'  # Cada lunes 6am UTC
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4

      - name: Instalar dependencias
        run: pip3 install requests

      - name: Ejecutar script de actualización
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/update_readme.py

      - name: Commit si hubo cambios
        run: |
          git config user.name "jesus alberto cornelio"
          git config user.email "365diascollaboration@gmail.com"
          git add README.md
          git diff --staged --quiet || git commit -m "chore: auto-update repos y colaboraciones"
          git pull --rebase origin main
          git push
